<h2>Dein Anmeldecode für das Dienstbrett</h2>
<p>Gib diesen Code in der App ein:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
<p>Oder tippe hier, um dich in diesem Browser anzumelden: <a href="{{ .ConfirmationURL }}">Anmelden</a></p>
<p>Code und Link sind eine Stunde gültig. Wenn du nichts angefordert hast, kannst du diese E-Mail ignorieren.</p>
